# Phone SoC (generic Dimensity-class subsystem set, no vendor internals).
# First instance of the common SoC spec: see socgen/SPEC.md for every key.
socgen: 1

soc:
  name: phone_soc
  prefix: phone              # SV function prefix: phone_decode(), ...
  desc: Phone SoC with 15 AXI masters, 6 IOMMUs, a 4x4 mesh NoC, 32 LPDDR5 ports and an APB peripheral bus

clock: {name: aclk, period_ns: 2.0}          # NoC clock, 500 MHz (the VIPs drive 1 ns after the edge: period >= 2 ns)
bus:   {addr_width: 32, data_width: 32, id_width: 4}

noc:
  topology: mesh
  rows: 4
  cols: 4
  routing: xy
  timing: {ni_cycles: 1, router_cycles: 1, link_cycles: 1}   # one way = 2*ni + (hops+1)*router + hops*link
  model: behavioral          # behavioral NoC component in the TB; "rtl" instantiates noc.rtl_module

# Traffic profiles the masters reference by name.
traffic:
  cpu:     {read_pct: 70, beats: [1, 4],   targets: [lpddr, boot_sram, periph]}
  gpu:     {read_pct: 60, beats: [4, 16],  targets: [lpddr]}
  npu:     {read_pct: 80, beats: [8, 16],  targets: [lpddr]}
  stream_wr: {read_pct: 10, beats: [8, 16], targets: [lpddr]}
  stream_rd: {read_pct: 95, beats: [8, 16], targets: [lpddr]}
  codec:   {read_pct: 60, beats: [4, 16],  targets: [lpddr]}
  dsp:     {read_pct: 60, beats: [1, 8],   targets: [lpddr, boot_sram]}
  io:      {read_pct: 50, beats: [4, 16],  targets: [lpddr]}
  ctrl:    {read_pct: 50, beats: [1, 4],   targets: [lpddr, boot_sram, periph]}

# QoS: class rt (real-time, has a deadline), nrt (throughput) or be (best effort).
# priority 0..15 wins NoC slave-port arbitration (higher first).
# latency_target: zero-load-relative read latency budget in cycles; the path
# report flags any path from this master whose p99 is above it.
masters:
  - {name: cpu,   node: [1, 1], traffic: cpu,       qos: {class: nrt, priority: 10, latency_target: 120}}
  - {name: gpu,   node: [2, 1], traffic: gpu,       qos: {class: nrt, priority: 4}}
  - {name: apu,   node: [2, 2], traffic: npu,       iommu: iommu_apu,  qos: {class: nrt, priority: 4}}
  - {name: isp,   node: [0, 2], traffic: stream_wr, iommu: iommu_isp,  qos: {class: rt, priority: 12, latency_target: 200}}
  - {name: icp,   node: [0, 2], traffic: ctrl,      iommu: iommu_icp,  qos: {class: nrt, priority: 6}}
  - {name: vdec,  node: [3, 2], traffic: codec,     iommu: iommu_vdec, qos: {class: nrt, priority: 6}}
  - {name: venc,  node: [3, 2], traffic: codec,     iommu: iommu_venc, qos: {class: nrt, priority: 6}}
  - {name: disp,  node: [3, 1], traffic: stream_rd, iommu: iommu_disp, qos: {class: rt, priority: 14, latency_target: 160}}
  - {name: adsp,  node: [1, 2], traffic: dsp,       qos: {class: rt, priority: 11, latency_target: 200}}
  - {name: modem, node: [0, 1], traffic: dsp,       qos: {class: rt, priority: 9,  latency_target: 250}}
  - {name: conn,  node: [0, 1], traffic: io,        qos: {class: nrt, priority: 5}}
  - {name: scp,   node: [1, 2], traffic: ctrl,      qos: {class: be, priority: 2}}
  - {name: ufs,   node: [2, 2], traffic: io,        qos: {class: nrt, priority: 3}}
  - {name: sec,   node: [1, 1], traffic: ctrl,      qos: {class: be, priority: 2}}
  - {name: dma,   node: [2, 1], traffic: io,        qos: {class: be, priority: 1}}

# IOMMUs sit at a master's network interface: they add tlb_hit_cycles to the
# request path and get one APB register block (register block "iommu").
iommus:
  - {name: iommu_apu,  tlb_hit_cycles: 2, tlb_entries: 64}
  - {name: iommu_isp,  tlb_hit_cycles: 2, tlb_entries: 32}
  - {name: iommu_icp,  tlb_hit_cycles: 2, tlb_entries: 16}
  - {name: iommu_vdec, tlb_hit_cycles: 2, tlb_entries: 32}
  - {name: iommu_venc, tlb_hit_cycles: 2, tlb_entries: 32}
  - {name: iommu_disp, tlb_hit_cycles: 2, tlb_entries: 32}

# Interleaved memory: one NoC slave port per channel.
memories:
  - name: lpddr
    kind: lpddr5
    base: 0x8000_0000
    size: 0x8000_0000          # 2 GB (32-bit AXI); a real phone has 8-16 GB
    channels: 32
    interleave: {granule: 0x1000, hash: xor}
    access_cycles: 24          # zero-load page-hit access in NoC cycles (for the ideal-latency table)
    timing: lpddr5-6400        # preset passed to an LPDDR5 slave VIP
    placement: {rows: [0, 3], fill: block}   # PHYs on the top and bottom edges: ch 0-15 on y=0 (x = ch/4), 16-31 on y=3

slaves:
  - {name: boot_sram, kind: memory, base: 0x0000_0000, size: 0x1_0000, node: [1, 1], access_cycles: 2}
  - name: periph
    kind: apb_bridge
    base: 0x1000_0000
    size: 0x1_0000              # 16 slots of 4 KB
    node: [2, 2]
    slot_size: 0x1000
    peripherals:
      - {name: gpio,    slot: 0, ip: GPIO}
      - {name: uart,    slot: 1, ip: UART, params: {CLK_FREQ: 100000000, BAUD: 12500000}, pins: {rxd: "1'b1"}}
      - {name: apb_ext, slot: 2, vip: apb}            # APB slave VIP (memory-backed) on an external slot
      - {name: i2c,     slot: 3, ip: I2C,  pins: {scl: "1'b1"}}
      - {name: spi,     slot: 4, ip: SPI,  pins: {csn: "1'b1"}}
      - {name: pwm,     slot: 5, ip: PWM}
      - {name: trng,    slot: 6, ip: TRNG}
      # IOMMU register blocks take the next free slots (7..12), in iommus order.

# Register blocks without open-ip RTL: socgen writes an APB register file for
# each instance and the RAL model from the same table.
register_blocks:
  iommu:
    desc: IOMMU control, page-table base, TLB maintenance and fault reporting
    regs:
      - {name: ID,           offset: 0x000, access: RO,  reset: 0x494F0100, desc: "code 0x494F ('IO'), version 1.0"}
      - {name: CTRL,         offset: 0x004, access: RW,  reset: 0x0, fields: [{name: EN, bits: "0"}, {name: IRQ_EN, bits: "1"}]}
      - {name: PT_BASE,      offset: 0x008, access: RW,  reset: 0x0, fields: [{name: PPN, bits: "31:12"}]}
      - {name: VA_BASE,      offset: 0x00C, access: RW,  reset: 0x0, fields: [{name: VPN, bits: "31:12"}]}
      - {name: VA_SIZE,      offset: 0x010, access: RW,  reset: 0x0, fields: [{name: PAGES, bits: "31:12"}]}
      - {name: INV,          offset: 0x014, access: WO,  reset: 0x0, desc: "write 1 to invalidate the TLB"}
      - {name: FAULT_STATUS, offset: 0x018, access: W1C, reset: 0x0, fields: [{name: VALID, bits: "0"}, {name: WRITE, bits: "1"}, {name: PERM, bits: "2"}]}
      - {name: FAULT_ADDR,   offset: 0x01C, access: RO,  reset: 0x0}
      - {name: FAULT_CNT,    offset: 0x020, access: RO,  reset: 0x0}
      - {name: TLB_HITS,     offset: 0x024, access: RO,  reset: 0x0, volatile: true}
      - {name: TLB_MISSES,   offset: 0x028, access: RO,  reset: 0x0, volatile: true}

regress:
  ral_master: cpu
  lists:
    testlist:
      - {test: smoke,        seeds: 1}
      - {test: ral,          seeds: 1}
      - {test: path_latency, seeds: 1}
      - {test: traffic,      seeds: 3}
    nightly:
      - {test: smoke,        seeds: 1}
      - {test: ral,          seeds: 2}
      - {test: path_latency, seeds: 1}
      - {test: traffic,      seeds: 10, plusargs: "+SOC_ITEMS=400"}
      - {test: traffic,      seeds: 5,  plusargs: "+SOC_ITEMS=400 +SOC_TIMING=2"}

report:
  latency:
    percentiles: [50, 90, 99]
    split_rw: true
    zero_load_slack: 12        # path_latency test: measured - ideal must stay within this (cycles, plus one per beat)
