# 8K HDTV SoC (a common 8K60 TV SoC, generic blocks, no vendor internals).
# Second instance of the common SoC spec after phone_soc.yaml: see
# socgen/SPEC.md for every key.
#
# Bandwidth: the TB's AXI ports are 32 bits at 1 GHz (4 GB/s per port), so
# the per-master bandwidth_mbps below are the real-world 8K60 figures x 0.25.
# The comment on each scenario line gives the real figure.
socgen: 1

soc:
  name: tv8k_soc
  prefix: tv8k
  desc: 8K HDTV SoC with 12 AXI masters, 5 IOMMUs, a 4x4 mesh NoC, 8 LPDDR5 ports and an APB peripheral bus

clock: {name: aclk, period_ns: 1.0}          # NoC clock, 1 GHz
bus:   {addr_width: 32, data_width: 32, id_width: 4}

noc:
  topology: mesh
  rows: 4
  cols: 4
  routing: xy
  timing: {ni_cycles: 1, router_cycles: 1, link_cycles: 1}
  model: behavioral

# Default traffic of each master (the `traffic` test). Scenarios below
# replace these per use case.
traffic:
  cpu:       {read_pct: 70, beats: [1, 16],  targets: [dram, boot_sram, periph]}
  gpu:       {read_pct: 60, beats: [8, 16],  targets: [dram]}
  npu:       {read_pct: 75, beats: [16, 64], targets: [dram]}
  vdec:      {read_pct: 60, beats: [4, 16],  targets: [dram]}     # 2D reference-block fetch + reconstructed writes
  pq:        {read_pct: 65, beats: [32, 64], targets: [dram]}     # MEMC: 2 frames in, 1 out
  disp:      {read_pct: 100, beats: [64, 64], targets: [dram]}    # scanout, isochronous
  hdmirx:    {read_pct: 0,  beats: [64, 64], targets: [dram]}     # capture, isochronous
  tsd:       {read_pct: 30, beats: [47, 47], targets: [dram]}     # 188-byte TS packets
  adsp:      {read_pct: 60, beats: [1, 8],   targets: [dram, boot_sram]}
  dma:       {read_pct: 50, beats: [16, 64], targets: [dram]}
  sec:       {read_pct: 50, beats: [4, 16],  targets: [dram, periph]}
  netio:     {read_pct: 50, beats: [8, 32],  targets: [dram]}

# QoS: rt = real-time with a deadline (display, capture, PQ, audio),
# nrt = throughput, be = best effort. latency_target is a read-latency budget
# in cycles; the report flags any path from the master whose p99 exceeds it.
masters:
  - {name: cpu,    node: [1, 1], traffic: cpu,    qos: {class: nrt, priority: 10, latency_target: 150}}
  - {name: gpu,    node: [2, 1], traffic: gpu,    qos: {class: nrt, priority: 4}}
  - {name: npu,    node: [1, 2], traffic: npu,    iommu: iommu_npu,    qos: {class: nrt, priority: 5}}
  - {name: vdec,   node: [2, 2], traffic: vdec,   iommu: iommu_vdec,   qos: {class: nrt, priority: 8}}
  - {name: pq,     node: [3, 2], traffic: pq,     iommu: iommu_pq,     qos: {class: rt,  priority: 12, latency_target: 250}}
  - {name: disp,   node: [3, 1], traffic: disp,   iommu: iommu_disp,   qos: {class: rt,  priority: 15, latency_target: 200}}
  - {name: hdmirx, node: [0, 2], traffic: hdmirx, iommu: iommu_hdmirx, qos: {class: rt,  priority: 13, latency_target: 250}}
  - {name: tsd,    node: [0, 1], traffic: tsd,    qos: {class: rt,  priority: 9,  latency_target: 300}}
  - {name: adsp,   node: [0, 1], traffic: adsp,   qos: {class: rt,  priority: 11, latency_target: 200}}
  - {name: dma,    node: [1, 1], traffic: dma,    qos: {class: be,  priority: 1}}
  - {name: sec,    node: [2, 1], traffic: sec,    qos: {class: nrt, priority: 6}}
  - {name: netio,  node: [3, 1], traffic: netio,  qos: {class: be,  priority: 2}}

iommus:
  - {name: iommu_npu,    tlb_hit_cycles: 2, tlb_entries: 64}
  - {name: iommu_vdec,   tlb_hit_cycles: 2, tlb_entries: 64}
  - {name: iommu_pq,     tlb_hit_cycles: 2, tlb_entries: 32}
  - {name: iommu_disp,   tlb_hit_cycles: 2, tlb_entries: 32}
  - {name: iommu_hdmirx, tlb_hit_cycles: 2, tlb_entries: 32}

# 8 memory-controller ports (e.g. 4 LPDDR5 x32 channels, 2 ports each).
memories:
  - name: dram
    kind: lpddr5
    base: 0x8000_0000
    size: 0x8000_0000          # 2 GB (32-bit AXI); a real 8K TV has 3-4 GB
    channels: 8
    interleave: {granule: 0x1000, hash: xor}
    access_cycles: 24
    timing: lpddr5-6400
    placement: {rows: [0, 3], fill: block}   # PHYs on the top and bottom die edges

slaves:
  - {name: boot_sram, kind: memory, base: 0x0000_0000, size: 0x1_0000, node: [1, 1], access_cycles: 2}
  - name: periph
    kind: apb_bridge
    base: 0x1000_0000
    size: 0x2_0000              # 32 slots of 4 KB
    node: [0, 2]
    slot_size: 0x1000
    peripherals:
      - {name: gpio,   slot: 0,  ip: GPIO}
      - {name: uart,   slot: 1,  ip: UART, params: {CLK_FREQ: 100000000, BAUD: 12500000}, pins: {rxd: "1'b1"}}
      - {name: apb_ext, slot: 2, vip: apb}
      - {name: i2c,    slot: 3,  ip: I2C,  pins: {scl: "1'b1"}}          # DDC/EDID, tuner, PMIC
      - {name: spi,    slot: 4,  ip: SPI,  pins: {csn: "1'b1"}}          # boot NOR flash
      - {name: pwm,    slot: 5,  ip: PWM}                                # backlight / local dimming
      - {name: trng,   slot: 6,  ip: TRNG}
      - {name: hdmi,   slot: 7,  ip: HDMI_2_1, pins: {hpd: "1'b1"}}      # HDMI link control (portfolio has the TX slice)
      - {name: hdcp,   slot: 8,  ip: HDCP_2_3_Content_Protection}
      - {name: i2s,    slot: 9,  ip: I2S_Audio}                          # speaker / sound-bar out
      - {name: crypto, slot: 10, ip: Crypto___Security_Engine}
      - {name: eth,    slot: 11, ip: Ethernet}
      - {name: usb,    slot: 12, ip: USB2_0}
      - {name: emmc,   slot: 13, ip: eMMC}
      # IOMMU register blocks take the next free slots (14..18), in iommus order.

register_blocks:
  iommu:
    desc: IOMMU control, page-table base, TLB maintenance and fault reporting
    regs:
      - {name: ID,           offset: 0x000, access: RO,  reset: 0x494F0100, desc: "code 0x494F ('IO'), version 1.0"}
      - {name: CTRL,         offset: 0x004, access: RW,  reset: 0x0, fields: [{name: EN, bits: "0"}, {name: IRQ_EN, bits: "1"}]}
      - {name: PT_BASE,      offset: 0x008, access: RW,  reset: 0x0, fields: [{name: PPN, bits: "31:12"}]}
      - {name: VA_BASE,      offset: 0x00C, access: RW,  reset: 0x0, fields: [{name: VPN, bits: "31:12"}]}
      - {name: VA_SIZE,      offset: 0x010, access: RW,  reset: 0x0, fields: [{name: PAGES, bits: "31:12"}]}
      - {name: INV,          offset: 0x014, access: WO,  reset: 0x0, desc: "write 1 to invalidate the TLB"}
      - {name: FAULT_STATUS, offset: 0x018, access: W1C, reset: 0x0, fields: [{name: VALID, bits: "0"}, {name: WRITE, bits: "1"}, {name: PERM, bits: "2"}]}
      - {name: FAULT_ADDR,   offset: 0x01C, access: RO,  reset: 0x0}
      - {name: FAULT_CNT,    offset: 0x020, access: RO,  reset: 0x0}
      - {name: TLB_HITS,     offset: 0x024, access: RO,  reset: 0x0, volatile: true}
      - {name: TLB_MISSES,   offset: 0x028, access: RO,  reset: 0x0, volatile: true}

regress:
  ral_master: cpu
  lists:
    testlist:
      - {test: smoke,        seeds: 1}
      - {test: ral,          seeds: 1}
      - {test: path_latency, seeds: 1}
      - {test: traffic,      seeds: 3}
    nightly:
      - {test: smoke,        seeds: 1}
      - {test: ral,          seeds: 2}
      - {test: path_latency, seeds: 1}
      - {test: traffic,      seeds: 10, plusargs: "+SOC_ITEMS=400"}
      - {test: traffic,      seeds: 5,  plusargs: "+SOC_ITEMS=400 +SOC_TIMING=2"}

report:
  latency:
    percentiles: [50, 90, 95, 99]
    split_rw: true
    zero_load_slack: 12
