# IP camera (IPCAM) SoC: a generic mid/high-end network camera, no vendor
# internals. Instance of the common SoC spec: see socgen/SPEC.md for every key.
#
#   MIPI CSI-2 sensor -> ISP -> 4K30 main stream + 1080p sub-stream in DDR
#   -> H.264/H.265 encoder (both streams) -> Ethernet (RTSP) and SD card
#   -> JPEG snapshots, NPU object detection on a downscaled copy,
#   audio in/out over I2S, crypto for secure boot and SRTP/TLS.
#
# Bandwidth figures are for the 4K30 configuration (3840x2160 YUV420 = 12.4 MB
# per frame, 373 MB/s per full-frame pass). A 1080p30 config divides the video
# masters' bandwidth by 4; see the "resolution" note at the end.
socgen: 1

soc:
  name: ipcam_soc
  prefix: ipcam
  desc: IP camera SoC with 11 AXI masters, 4 IOMMUs, an AXI crossbar, 2 DDR controller ports, SPI-NOR XIP and an APB peripheral bus

clock: {name: aclk, period_ns: 2.0}          # 500 MHz system/NoC clock
bus:   {addr_width: 32, data_width: 32, id_width: 4}

# Camera SoCs use a NIC-style crossbar rather than a mesh: every path is 0 hops.
noc:
  topology: crossbar
  rows: 1
  cols: 1
  routing: xy
  timing: {ni_cycles: 1, router_cycles: 2, link_cycles: 0}
  model: behavioral

traffic:
  # quad-core application cluster: cache-line refills/evictions, boot code, MMIO
  cpu:       {read_pct: 70, beats: [1, 8],   targets: [ddr, boot_sram, spi_nor, periph], bandwidth_mbps: 300, pace: true}
  # ISP: writes the 4K main + 1080p sub YUV frames, reads/writes the 3DNR reference
  isp:       {read_pct: 35, beats: [8, 16],  targets: [ddr], bandwidth_mbps: 1200, pace: true}
  # H.264/H.265: reads current + reference frames (motion search), writes recon + bitstream
  venc:      {read_pct: 65, beats: [8, 16],  targets: [ddr], bandwidth_mbps: 1300, pace: true}
  # JPEG snapshots of the 1080p sub-stream, a few per second
  jpeg:      {read_pct: 80, beats: [8, 16],  targets: [ddr], bandwidth_mbps: 60, pace: true}
  # NPU: 640x640 detection at 15 fps plus weight fetch
  npu:       {read_pct: 85, beats: [8, 16],  targets: [ddr], bandwidth_mbps: 300, pace: true}
  # GbE MAC DMA: mostly TX of the encoded streams (descriptor + payload reads)
  eth:       {read_pct: 85, beats: [4, 16],  targets: [ddr], bandwidth_mbps: 125, pace: true}
  # SD card recording / eMMC firmware and logs
  storage:   {read_pct: 30, beats: [4, 16],  targets: [ddr], bandwidth_mbps: 20, pace: true}
  # I2S audio DMA: small, periodic, latency sensitive
  audio:     {read_pct: 50, beats: [1, 4],   targets: [ddr], bandwidth_mbps: 1, pace: true}
  # AES/SHA engine: secure-boot image hash from SPI-NOR, SRTP/TLS on the streams
  crypto:    {read_pct: 55, beats: [4, 16],  targets: [ddr, spi_nor], bandwidth_mbps: 60, pace: true}
  # system DMA: OSD overlays, buffer copies, boot image copy from SPI-NOR
  dma:       {read_pct: 50, beats: [4, 16],  targets: [ddr, spi_nor, boot_sram], bandwidth_mbps: 100, pace: true}

# latency_target: read latency budget in cycles (500 MHz). Real-time masters
# (ISP line output, audio) have FIFOs that must not overflow/underflow.
masters:
  - {name: cpu,    node: [0, 0], traffic: cpu,     qos: {class: nrt, priority: 10, latency_target: 150}}
  - {name: isp,    node: [0, 0], traffic: isp,     iommu: iommu_isp,  qos: {class: rt,  priority: 14, latency_target: 200}}
  # Real IPs (kind rtl): wrappers in rtl/ipcam/, private RTL fetched by
  # scripts/fetch_ext_ip.sh. Each wrapper also serves its APB slot (apb).
  # Without ext/ the generator falls back to the VIP traffic profile.
  - {name: venc,   node: [0, 0], traffic: venc,    iommu: iommu_venc, qos: {class: nrt, priority: 8,  latency_target: 400},
     kind: rtl, rtl: {module: ipcam_venc_c1p, filelist: ext/ipcam_ext.f, apb: venc_cfg, fallback: vip}}
  - {name: jpeg,   node: [0, 0], traffic: jpeg,    iommu: iommu_jpeg, qos: {class: nrt, priority: 5},
     kind: rtl, rtl: {module: ipcam_jpeg_c1p, filelist: ext/ipcam_ext.f, apb: jpeg_cfg, fallback: vip}}
  - {name: npu,    node: [0, 0], traffic: npu,     iommu: iommu_npu,  qos: {class: nrt, priority: 6},
     kind: rtl, rtl: {module: ipcam_npu_xj,   filelist: ext/ipcam_ext.f, apb: npu_cfg, fallback: vip}}
  - {name: eth,    node: [0, 0], traffic: eth,     qos: {class: nrt, priority: 9,  latency_target: 300}}
  - {name: sdmmc,  node: [0, 0], traffic: storage, qos: {class: be,  priority: 3}}
  - {name: emmc,   node: [0, 0], traffic: storage, qos: {class: be,  priority: 2}}
  - {name: audio,  node: [0, 0], traffic: audio,   qos: {class: rt,  priority: 12, latency_target: 150}}
  - {name: crypto, node: [0, 0], traffic: crypto,  qos: {class: nrt, priority: 7}}
  - {name: dma,    node: [0, 0], traffic: dma,     qos: {class: be,  priority: 4}}

# SMMU-style translation for the media engines (physically scattered frame buffers).
iommus:
  - {name: iommu_isp,  tlb_hit_cycles: 2, tlb_entries: 32}
  - {name: iommu_venc, tlb_hit_cycles: 2, tlb_entries: 64}
  - {name: iommu_jpeg, tlb_hit_cycles: 2, tlb_entries: 16}
  - {name: iommu_npu,  tlb_hit_cycles: 2, tlb_entries: 32}

# One 32-bit DDR4/LPDDR4 interface, modelled as two controller ports
# interleaved on 4 KB with an XOR hash (1 GB).
memories:
  - name: ddr
    kind: ddr
    base: 0x8000_0000
    size: 0x4000_0000
    channels: 2
    interleave: {granule: 0x1000, hash: xor}
    access_cycles: 30          # ~60 ns zero-load page-hit at 500 MHz
    timing: lpddr4-3200        # preset for the DRAM slave VIP (see README: VIP gap)
    placement: {nodes: [[0, 0], [0, 0]]}

slaves:
  - {name: boot_sram, kind: memory, base: 0x0000_0000, size: 0x1_0000, node: [0, 0], access_cycles: 2}
  # Quad-SPI NOR flash, memory-mapped (XIP) window: slow first access
  - {name: spi_nor,   kind: vip,    base: 0x2000_0000, size: 0x100_0000, node: [0, 0], access_cycles: 40}
  - name: periph
    kind: apb_bridge
    base: 0x1000_0000
    size: 0x2_0000              # 32 slots of 4 KB
    node: [0, 0]
    slot_size: 0x1000
    peripherals:
      # --- system ---
      - {name: gpio,       slot: 0,  ip: GPIO}
      - {name: uart,       slot: 1,  ip: UART, params: {CLK_FREQ: 500000000, BAUD: 31250000}, pins: {rxd: "1'b1"}}
      - {name: timer,      slot: 2,  regs: timer_wdt}
      - {name: apb_ext,    slot: 3,  vip: apb}
      # --- sensor and image ---
      - {name: csi2,       slot: 4,  ip: CSI_2,                       # MIPI CSI-2 receiver, fed by a sensor model
         pins_vip: {model: csi2_tx_model, files: [tb/ipcam_soc/devices/csi2_tx_model.sv], params: {FRAMES: 2, LINES: 4, WIDTH: 16}, map: {en: "1'b1"}}}
      - {name: i2c_sns,    slot: 5,  ip: I2C, pins: {scl: "1'b1"}}    # sensor control (SCCB)
      - {name: pwm,        slot: 6,  ip: PWM}                         # IR-cut filter / IR LED
      - {name: isp_cfg,    slot: 7,  regs: mm_engine}
      - {name: venc_cfg,   slot: 8,  rtl_master: venc, ral: c1p_hve}     # c1p HEVC encoder registers
      - {name: jpeg_cfg,   slot: 9,  rtl_master: jpeg, ral: c1p_jpe}     # c1p JPEG encoder registers
      - {name: npu_cfg,    slot: 10, rtl_master: npu,  ral: xj_npu_ss}   # xuanji NPU subsystem registers
      - {name: dma_cfg,    slot: 11, regs: mm_engine}
      # --- network and storage ---
      - {name: eth_mac,    slot: 12, ip: Ethernet,                    # GbE MAC (GMII), PHY model on the far end
         pins_vip: {model: gmii_phy_model, files: [tb/ipcam_soc/devices/gmii_phy_model.sv], params: {DIV: 31, GEN_N: 2, START: 200}}}
      - {name: mdio,       slot: 13, ip: MDIO, pins: {mdc: "1'b0"}}
      - {name: sd,         slot: 14, ip: SD, params: {ID_CLK_DIV: 8}, pins_vip: {model: sdc_model, vip: SD_Card-UVM-VIP, inout: [cmd, dat]}}            # SD card device model
      - {name: emmc_ctl,   slot: 15, ip: eMMC, params: {ID_CLK_DIV: 8, RST_WAIT: 64}, pins_vip: {model: emd_model, vip: eMMC_Device-UVM-VIP, inout: [cmd, {pin: "dat[0]", port: dat0}]}}   # eMMC device model (1-bit)
      - {name: qspi,       slot: 16, ip: QSPI, pins: {csn: "1'b1", sclk: "1'b0"}}
      - {name: spi,        slot: 17, ip: SPI,  pins: {csn: "1'b1"}}  # PTZ motor / pan-tilt driver
      # --- audio ---
      - {name: i2s,        slot: 18, ip: I2S,                         # I2S port, codec model is the clock master
         pins_vip: {model: i2s_codec_model, files: [tb/ipcam_soc/devices/i2s_codec_model.sv], params: {DIV: 8, SLOT: 32}, map: {en: "1'b1"}}}
      # --- security ---
      - {name: crypto_eng, slot: 19, ip: Crypto___Security_Engine}
      - {name: aes,        slot: 20, ip: AES_GCM}
      - {name: sha3,       slot: 21, ip: SHA3}
      - {name: trng,       slot: 22, ip: TRNG}
      - {name: rot,        slot: 23, ip: Root_of_Trust}               # secure boot / lifecycle
      # IOMMU register blocks take the next free slots (24..27), in iommus order.

register_blocks:
  iommu:
    desc: IOMMU control, page-table base, TLB maintenance and fault reporting
    regs:
      - {name: ID,           offset: 0x000, access: RO,  reset: 0x494F0100, desc: "code 0x494F ('IO'), version 1.0"}
      - {name: CTRL,         offset: 0x004, access: RW,  reset: 0x0, fields: [{name: EN, bits: "0"}, {name: IRQ_EN, bits: "1"}]}
      - {name: PT_BASE,      offset: 0x008, access: RW,  reset: 0x0, fields: [{name: PPN, bits: "31:12"}]}
      - {name: VA_BASE,      offset: 0x00C, access: RW,  reset: 0x0, fields: [{name: VPN, bits: "31:12"}]}
      - {name: VA_SIZE,      offset: 0x010, access: RW,  reset: 0x0, fields: [{name: PAGES, bits: "31:12"}]}
      - {name: INV,          offset: 0x014, access: WO,  reset: 0x0, desc: "write 1 to invalidate the TLB"}
      - {name: FAULT_STATUS, offset: 0x018, access: W1C, reset: 0x0, fields: [{name: VALID, bits: "0"}, {name: WRITE, bits: "1"}, {name: PERM, bits: "2"}]}
      - {name: FAULT_ADDR,   offset: 0x01C, access: RO,  reset: 0x0}
      - {name: FAULT_CNT,    offset: 0x020, access: RO,  reset: 0x0}
      - {name: TLB_HITS,     offset: 0x024, access: RO,  reset: 0x0, volatile: true}
      - {name: TLB_MISSES,   offset: 0x028, access: RO,  reset: 0x0, volatile: true}
  # Control block for the engines that are still VIP traffic models (ISP,
  # system DMA).
  mm_engine:
    desc: Media engine control (frame descriptors, start/status, QoS)
    regs:
      - {name: ID,         offset: 0x000, access: RO,  reset: 0x4D450100, desc: "code 0x4D45 ('ME'), version 1.0"}
      - {name: CTRL,       offset: 0x004, access: RW,  reset: 0x0, fields: [{name: EN, bits: "0"}, {name: IRQ_EN, bits: "1"}, {name: MODE, bits: "7:4"}]}
      - {name: START,      offset: 0x008, access: WO,  reset: 0x0, desc: "write 1 to start a frame"}
      - {name: STATUS,     offset: 0x00C, access: RO,  reset: 0x0, volatile: true, fields: [{name: BUSY, bits: "0"}, {name: DONE, bits: "1"}, {name: ERR, bits: "2"}]}
      - {name: SRC_ADDR,   offset: 0x010, access: RW,  reset: 0x0}
      - {name: DST_ADDR,   offset: 0x014, access: RW,  reset: 0x0}
      - {name: STRIDE,     offset: 0x018, access: RW,  reset: 0x0, fields: [{name: BYTES, bits: "15:0"}]}
      - {name: FRAME_SIZE, offset: 0x01C, access: RW,  reset: 0x0, fields: [{name: WIDTH, bits: "15:0"}, {name: HEIGHT, bits: "31:16"}]}
      - {name: QOS,        offset: 0x020, access: RW,  reset: 0x0, fields: [{name: PRIO, bits: "3:0"}, {name: OUTSTANDING, bits: "11:8"}]}
      - {name: IRQ_STATUS, offset: 0x024, access: W1C, reset: 0x0, fields: [{name: DONE, bits: "0"}, {name: ERR, bits: "1"}]}
  timer_wdt:
    desc: System timer and watchdog
    regs:
      - {name: ID,        offset: 0x000, access: RO,  reset: 0x54570100, desc: "code 0x5457 ('TW'), version 1.0"}
      - {name: CTRL,      offset: 0x004, access: RW,  reset: 0x0, fields: [{name: TMR_EN, bits: "0"}, {name: WDT_EN, bits: "1"}, {name: IRQ_EN, bits: "2"}]}
      - {name: LOAD,      offset: 0x008, access: RW,  reset: 0x0}
      - {name: VALUE,     offset: 0x00C, access: RO,  reset: 0x0, volatile: true}
      - {name: WDT_LOAD,  offset: 0x010, access: RW,  reset: 0xFFFFFFFF}
      - {name: WDT_KICK,  offset: 0x014, access: WO,  reset: 0x0}
      - {name: IRQ_STATUS, offset: 0x018, access: W1C, reset: 0x0, fields: [{name: TMR, bits: "0"}, {name: WDT, bits: "1"}]}

  # Register maps of the real IPs (rtl_only: RAL model only, the registers live
  # in the IP). Taken from c1p_jpe_regs.sv / c1p_hve_regs.sv (c1p-codec) and
  # docs/apb.md "NPU Subsystem" (xuanji-core) at the revisions pinned in
  # scripts/fetch_ext_ip.sh. Left out of the RAL: trigger registers (CMD,
  # CMD_PUSH, PERF_CTRL; a RAL write would start the engine), read-to-clear
  # registers (CPL_POP, PERF_*_LO) and the JPEG quantisation tables.
  c1p_jpe:
    desc: c1p JPEG encoder (c1p_jpe_regs)
    rtl_only: true
    regs:
      - {name: STATUS,     offset: 0x04, access: RO,  reset: 0x0, volatile: true, fields: [{name: BUSY, bits: "0"}, {name: ERR_CODE, bits: "7:4"}]}
      - {name: IRQ_STATUS, offset: 0x08, access: W1C, reset: 0x0, fields: [{name: DONE, bits: "0"}, {name: ERR, bits: "1"}]}
      - {name: IRQ_ENABLE, offset: 0x0C, access: RW,  reset: 0x0, fields: [{name: DONE, bits: "0"}, {name: ERR, bits: "1"}]}
      - {name: FMT,        offset: 0x10, access: RW,  reset: 0x0, fields: [{name: FMT, bits: "1:0"}]}
      - {name: SIZE,       offset: 0x14, access: RW,  reset: 0x0, fields: [{name: WIDTH, bits: "13:0"}, {name: HEIGHT, bits: "29:16"}]}
      - {name: Y_BASE,     offset: 0x18, access: RW,  reset: 0x0}
      - {name: C_BASE,     offset: 0x1C, access: RW,  reset: 0x0}
      - {name: STRIDE,     offset: 0x20, access: RW,  reset: 0x0, fields: [{name: Y, bits: "15:0"}, {name: C, bits: "31:16"}]}
      - {name: OUT_BASE,   offset: 0x24, access: RW,  reset: 0x0}
      - {name: OUT_CAP,    offset: 0x28, access: RW,  reset: 0x0}
      - {name: DRI,        offset: 0x2C, access: RW,  reset: 0x0, fields: [{name: MCUS, bits: "15:0"}]}
      - {name: OUT_BYTES,  offset: 0x30, access: RO,  reset: 0x0, volatile: true}
      - {name: CYCLES,     offset: 0x34, access: RO,  reset: 0x0, volatile: true}
      - {name: STL_IN,     offset: 0x38, access: RO,  reset: 0x0, volatile: true}
      - {name: STL_OUT,    offset: 0x3C, access: RO,  reset: 0x0, volatile: true}
      - {name: ID,         offset: 0xF8, access: RO,  reset: 0x4A504501}
      - {name: CAP,        offset: 0xFC, access: RO,  reset: 0x2000000F}
  c1p_hve:
    desc: c1p HEVC intra encoder (c1p_hve_regs)
    rtl_only: true
    regs:
      - {name: STATUS,       offset: 0x04, access: RO,  reset: 0x0, volatile: true, fields: [{name: BUSY, bits: "0"}, {name: ERR_CODE, bits: "7:4"}, {name: SLICES, bits: "31:16"}]}
      - {name: IRQ_STATUS,   offset: 0x08, access: W1C, reset: 0x0, fields: [{name: DONE, bits: "0"}, {name: ERR, bits: "1"}, {name: SLICE, bits: "2"}]}
      - {name: IRQ_ENABLE,   offset: 0x0C, access: RW,  reset: 0x0, fields: [{name: EN, bits: "2:0"}]}
      - {name: SIZE,         offset: 0x10, access: RW,  reset: 0x0, fields: [{name: WIDTH, bits: "13:0"}, {name: HEIGHT, bits: "29:16"}]}
      - {name: Y_BASE,       offset: 0x14, access: RW,  reset: 0x0}
      - {name: C_BASE,       offset: 0x18, access: RW,  reset: 0x0}
      - {name: STRIDE,       offset: 0x1C, access: RW,  reset: 0x0, fields: [{name: Y, bits: "15:0"}, {name: C, bits: "31:16"}]}
      - {name: REC_Y,        offset: 0x20, access: RW,  reset: 0x0}
      - {name: REC_C,        offset: 0x24, access: RW,  reset: 0x0}
      - {name: REC_STRIDE,   offset: 0x28, access: RW,  reset: 0x0, fields: [{name: Y, bits: "15:0"}, {name: C, bits: "31:16"}]}
      - {name: OUT_BASE,     offset: 0x2C, access: RW,  reset: 0x0}
      - {name: OUT_CAP,      offset: 0x30, access: RW,  reset: 0x0}
      - {name: PIC_CFG,      offset: 0x34, access: RW,  reset: 0xBA13031E, fields: [{name: QP, bits: "5:0", reset: 30}, {name: PS_EN, bits: "8", reset: 1}, {name: REC_EN, bits: "9", reset: 1}, {name: QMAP_EN, bits: "10"}, {name: NAL_TYPE, bits: "21:16", reset: 19}, {name: LEVEL_IDC, bits: "31:24", reset: 186}]}
      - {name: SLICE,        offset: 0x38, access: RW,  reset: 0x0, fields: [{name: CTU_ROWS, bits: "9:0"}, {name: POC, bits: "31:16"}]}
      - {name: MODE_MASK_LO, offset: 0x3C, access: RW,  reset: 0x44444447}
      - {name: MODE_MASK_HI, offset: 0x40, access: RW,  reset: 0x4, fields: [{name: MASK, bits: "2:0", reset: 4}]}
      - {name: QMAP_BASE,    offset: 0x44, access: RW,  reset: 0x0}
      - {name: OUT_BYTES,    offset: 0x48, access: RO,  reset: 0x0, volatile: true}
      - {name: SLICE_BYTES,  offset: 0x4C, access: RO,  reset: 0x0, volatile: true}
      - {name: CYCLES,       offset: 0x50, access: RO,  reset: 0x0, volatile: true}
      - {name: BINS,         offset: 0x54, access: RO,  reset: 0x0, volatile: true}
      - {name: STL_SRC,      offset: 0x58, access: RO,  reset: 0x0, volatile: true}
      - {name: STL_ENT,      offset: 0x5C, access: RO,  reset: 0x0, volatile: true}
      - {name: ID,           offset: 0xF8, access: RO,  reset: 0x48564501}
      - {name: CAP,          offset: 0xFC, access: RO,  reset: 0x20000007}
  xj_npu_ss:
    desc: xuanji NPU subsystem (npu_ss_regs; N=8, NCU=4, NB=4, DEPTH=1024)
    rtl_only: true
    regs:
      - {name: ID,         offset: 0x000, access: RO,  reset: 0x584E0200}
      - {name: CFG0,       offset: 0x004, access: RO,  reset: 0x0A040408}
      - {name: CFG1,       offset: 0x008, access: RO,  reset: 0x0, volatile: true, desc: "QD, OUT, TILE_ID, CQ (build parameters)"}
      - {name: IRQ_STATUS, offset: 0x010, access: W1C, reset: 0x0, fields: [{name: CPL, bits: "0", access: RO}, {name: CMD_OVF, bits: "1"}, {name: VEC_ERR, bits: "2"}, {name: BUS_ERR, bits: "31"}]}
      - {name: IRQ_ENABLE, offset: 0x014, access: RW,  reset: 0x0, fields: [{name: CPL, bits: "0"}, {name: CMD_OVF, bits: "1"}, {name: VEC_ERR, bits: "2"}, {name: BUS_ERR, bits: "31"}]}
      - {name: STATUS,     offset: 0x040, access: RO,  reset: 0x0, volatile: true, fields: [{name: BUSY, bits: "0"}, {name: CPL_AVAIL, bits: "1"}, {name: CMDQ_FULL, bits: "2"}, {name: CMDQ_EMPTY, bits: "3"}, {name: CMDQ_FREE, bits: "11:8"}]}
      - {name: CMD_CTL,    offset: 0x060, access: RW,  reset: 0x0, fields: [{name: OP, bits: "1:0"}, {name: WT, bits: "2"}, {name: SA, bits: "3"}, {name: SB, bits: "4"}, {name: OP2, bits: "5"}, {name: ID, bits: "15:8"}, {name: K, bits: "31:16"}]}
      - {name: CMD_EXT,    offset: 0x064, access: RW,  reset: 0x0}
      - {name: CMD_A,      offset: 0x068, access: RW,  reset: 0x0, fields: [{name: ADDR, bits: "25:0"}]}
      - {name: CMD_B,      offset: 0x06C, access: RW,  reset: 0x0, fields: [{name: ADDR, bits: "25:0"}]}
      - {name: CMD_C,      offset: 0x070, access: RW,  reset: 0x0, fields: [{name: ADDR, bits: "25:0"}]}
      - {name: CPL_PEEK,   offset: 0x084, access: RO,  reset: 0x0, volatile: true}

regress:
  ral_master: cpu
  lists:
    testlist:
      - {test: smoke,        seeds: 1}
      - {test: ral,          seeds: 1}
      - {test: path_latency, seeds: 1}
      - {test: traffic,      seeds: 3}
    nightly:
      - {test: smoke,        seeds: 1}
      - {test: ral,          seeds: 2}
      - {test: path_latency, seeds: 1}
      - {test: traffic,      seeds: 10, plusargs: "+SOC_ITEMS=400"}
      - {test: traffic,      seeds: 5,  plusargs: "+SOC_ITEMS=400 +SOC_TIMING=2"}

report:
  latency:
    percentiles: [50, 90, 95, 99]
    split_rw: true
    zero_load_slack: 12
