# CHI coherence across two dies: one 2x2 mesh per die joined by UCIe (open-ip
# UCIe_top, Retry on). Each die has a CPU cluster (CHI RN-F with a cache in the
# bench) and a home (HN-F); the homes interleave the coherent DDR per 4 KB, so
# requests, snoops, DCT forwards and DMT data all cross the link. DDR sits on
# die 1; the DMA (die 0) and NPU (die 1) are RN-Is.
socgen: 1
soc: {name: chi_chiplet_soc, prefix: cchip, desc: CHI coherence across two dies joined by UCIe}
clock: {period_ns: 2.0}
noc:
  topology: mesh
  rows: 2
  cols: 2
  timing: {ni_cycles: 1, router_cycles: 1, link_cycles: 1}
  model: mesh
  router: orca

chiplet:
  dies: 2
  link: ucie
  gateways: [[1, 1], [0, 0]]
  phy_cycles: 4
  retry: true

chi:
  home:                     # one home per die
    - {node: [0, 1], die: 0}
    - {node: [1, 0], die: 1}
  coherent: [ddr]
  cache_lines: 16
  dmt: true
  dct: true

traffic:
  cpu: {read_pct: 60, beats: [1, 8],  targets: [ddr, sram, periph]}
  dma: {read_pct: 50, beats: [4, 16], targets: [ddr, sram]}
  npu: {read_pct: 70, beats: [8, 16], targets: [ddr]}

masters:
  - {name: cpu0, die: 0, node: [0, 0], traffic: cpu, protocol: chi}
  - {name: dma,  die: 0, node: [1, 0], traffic: dma}
  - {name: cpu1, die: 1, node: [0, 0], traffic: cpu, protocol: chi}
  - {name: npu,  die: 1, node: [1, 1], traffic: npu}

memories:
  - name: ddr
    die: 1
    kind: ddr
    base: 0x8000_0000
    size: 0x1000_0000
    channels: 2
    interleave: {granule: 0x1000, hash: xor}
    access_cycles: 12
    placement: {nodes: [[0, 1], [1, 1]]}

slaves:
  - {name: sram, die: 0, kind: memory, base: 0x0, size: 0x1_0000, node: [0, 1], access_cycles: 1}
  - name: periph
    die: 0
    kind: apb_bridge
    base: 0x1000_0000
    size: 0x1_0000
    node: [1, 1]
    peripherals:
      - {name: gpio, ip: GPIO}

regress:
  ral_master: cpu0
  lists:
    testlist:
      - {test: smoke,        seeds: 1}
      - {test: ral,          seeds: 1}
      - {test: path_latency, seeds: 1}
      - {test: traffic,      seeds: 1}
      - {test: coherence,    seeds: 2}
      - {test: coherence,    seeds: 1, plusargs: "+D2D_ERR_EVERY=7"}
