name: regression
on:
  push:
  pull_request:
  schedule:
    - cron: "0 18 * * *"        # nightly list
  workflow_dispatch:
    inputs:
      list:
        description: test list
        default: regress/testlist.txt
jobs:
  regress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERILATOR_VERSION: v5.052
      VERILATOR_PREFIX: /opt/verilator
    steps:
      - uses: actions/checkout@v4
      - name: Cache Verilator
        id: vcache
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-${{ runner.os }}-ubuntu-24.04
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfl2 ccache
          sudo mkdir -p /opt/verilator && sudo chown "$USER" /opt/verilator
          bash scripts/install_tools.sh
          echo "/opt/verilator/bin" >> "$GITHUB_PATH"
      - name: Regression
        run: |
          LIST="${{ github.event.inputs.list }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then LIST=regress/nightly.txt; fi
          python3 regress/regress.py --list "${LIST:-regress/testlist.txt}" --jobs "$(nproc)"
      - name: Summary
        if: always()
        run: cat regress_out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress_out
          path: regress_out/
