# IPCAM use case on the generated ipcam_hd_soc bench with the real IPs (tb/ipcam_soc):
# the CPU programs the c1p JPEG and HEVC encoders and the xuanji NPU over the
# NoC and APB while every other master runs its traffic profile. JPEG / HEVC
# output is checked bit-exact against regress/vectors/ipcam, NPU DMA data
# against its source. Needs the private RTL (scripts/fetch_ext_ip.sh); without
# it the suite is reported as not run and the ipcam_hd_soc suite (traffic models on
# those ports) still runs.
name: ipcam_hd_soc_media
level: soc
soc: ipcam_hd
description: Real JPEG + HEVC + NPU concurrently with all-master traffic; bit-exact streams, per-path latency.
filelist: sim/ipcam_hd_soc_media.f
top: ipcam_hd_soc_tb_top
list: {default: regress/lists/ipcam_hd_soc_media.txt, nightly: regress/lists/ipcam_hd_soc_media_nightly.txt}
requires: [ext/ipcam_ext.f]
cov_include: ["*rtl/ipcam/*", "*ext/*"]
timeout: 1800
